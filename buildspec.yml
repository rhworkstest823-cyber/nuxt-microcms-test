version: 0.2

env:
  # SSMパラメータストアから環境変数を取得
  parameter-store:
    MICROCMS_SERVICE_DOMAIN: '/nuxt-microcms/Test/MICROCMS_SERVICE_DOMAIN'
    MICROCMS_API_KEY: '/nuxt-microcms/Test/MICROCMS_API_KEY'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  build:
    commands:
      - echo "=== Building Nuxt SSG ==="
      - npm run generate
      - echo "=== Build complete ==="
      - ls -la dist/

  post-build:
    commands:
      - echo "=== Deploying to S3 ==="
      # HTMLファイル: キャッシュなし
      - |
        aws s3 sync dist/ s3://nuxt-microcms-test-s3-bucket-748241639535-ap-northeast-1-an/
          --delete
          --exclude "_nuxt/*"
          --cache-control "public, max-age=0, must-revalidate"
          --profile aws-test-codepipeline

      # JS/CSSファイル: 長期キャッシュ
      - |
        aws s3 sync dist/_nuxt/ s3://nuxt-microcms-test-s3-bucket-748241639535-ap-northeast-1-an/_nuxt/
          --cache-control "public, max-age=31536000, immutable"
          --profile aws-test-codepipeline

      - echo "=== Invalidating CloudFront cache ==="

      # CloudFrontのキャッシュを削除
      - |
        aws cloudfront create-invalidation
          --distribution-id E2FPH5GSMLHCSA
          --paths "/*"
          --profile aws-test-codepipeline

      - echo "=== Deploy complete ==="
